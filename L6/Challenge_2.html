<!DOCTYPE html>
<html>
  <head>
    <title></title>
  </head>
  <body>
    <script>
      let qty = 0;
    </script>
    <button onclick="console.log(`Cart quantity: ${qty}`);">Show Quantity</button>
    <button onclick="qty += 1; console.log(`Cart quantity: ${qty}`);">Add to Cart</button>
    <button onclick="
      if (qty - 1 < 0) {
        alert('Not enough items in the cart');
      } else {
        qty--;
        console.log(`Cart quantity: ${qty}`);
      }
    ">Remove from cart</button>
    <button onclick="
      if (qty - 2 < 0) {
        alert('Not enough items in the cart');
      } else {
        qty -= 2;
        console.log(`Cart quantity: ${qty}`);
      }
    ">-2</button>
    <button onclick="
      if (qty - 3 < 0) {
        alert('Not enough items in the cart');
      } else {
        qty -= 3;
        console.log(`Cart quantity: ${qty}`);
      }
    ">-3</button>
    <button onclick="qty = 0; console.log('Cart was reset.'); console.log(`Cart quantity: ${qty}`);">Reset Cart</button>
  </body>
</html>
